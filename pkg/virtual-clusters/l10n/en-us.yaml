  cpu: CPU
  memory: Memory
  pods: Pods
  cpuPlaceholder: e.g. 2
  memoryPlaceholder: e.g. 2Gi
  podsPlaceholder: e.g. 10
  generic:
    countPersistentVolumeClaims: PersistentVolumeClaim Count
    countPods: Pod Count
    countReplicationControllers: ReplicationController Count
    requestsNvidiaComGpu: GPU Requests
    countSecrets: Secret Count
    countServices: Service Count
    countConfigMaps: ConfigMap Count
    servicesLoadBalancers: LoadBalancer Count
    servicesNodePorts: NodePort Count